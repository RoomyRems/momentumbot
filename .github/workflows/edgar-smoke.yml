name: SEC EDGAR smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SEC_USER_AGENT: MomentumBot/0.2 RoomyRems 168698529+RoomyRems@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Probe free SEC data APIs
        run: python scripts/edgar_smoke.py
