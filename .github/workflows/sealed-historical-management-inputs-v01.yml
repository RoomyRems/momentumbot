name: Sealed historical complete management inputs v0.1

on:
  push:
    branches: [phase-3-historical-snapshot]
    paths:
      - .github/workflows/sealed-historical-management-inputs-v01.yml
      - src/momentumbot/research/sealed_historical_management_inputs_v01.py
      - scripts/build_sealed_historical_management_inputs_v01.py
      - tests/test_sealed_historical_management_inputs_v01.py
      - research/strategy/sealed-historical-management-inputs-v0.1.json
      - research/runtime/sealed-historical-management-inputs-v0.1/**

permissions:
  contents: read
  actions: read

concurrency:
  group: sealed-historical-management-inputs-v01
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install the frozen verification environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-execution-quote-v01.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Validate registration and adversarial composition tests offline
        run: |
          python scripts/build_sealed_historical_management_inputs_v01.py --validate-registration
          python -m unittest tests.test_sealed_historical_management_inputs_v01 tests.test_sealed_historical_management_capture_v01 tests.test_sealed_historical_management_reuse_v01 -v
          python -O -m unittest tests.test_sealed_historical_management_inputs_v01 tests.test_sealed_historical_management_capture_v01 tests.test_sealed_historical_management_reuse_v01 -v
          python - <<'PY'
          from pathlib import Path
          from check_recovery_entrypoints_v13 import undefined_globals
          for name in ('scripts/build_sealed_historical_management_inputs_v01.py', 'src/momentumbot/research/sealed_historical_management_inputs_v01.py'):
              missing = undefined_globals(Path(name).read_text(), name)
              if missing:
                  raise SystemExit(f'{name}: {sorted(missing)}')
          PY
      - name: Download only the three immutable retained GitHub source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/RoomyRems/momentumbot/actions/artifacts/9995887799/zip > "$RUNNER_TEMP/original-sip.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/9995587996/zip > "$RUNNER_TEMP/original-bars.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/10026551595/zip > "$RUNNER_TEMP/missing-tails.zip"
      - name: Reverify all sources and reconstruct every complete management tape offline
        run: >-
          python scripts/build_sealed_historical_management_inputs_v01.py --build --check-committed
          --sip-zip "$RUNNER_TEMP/original-sip.zip" --bars-zip "$RUNNER_TEMP/original-bars.zip"
          --tails-zip "$RUNNER_TEMP/missing-tails.zip" --output-root artifacts/sealed-historical-management-inputs-v0.1
      - name: Retain the verified complete management input bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-historical-management-inputs-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sealed-historical-management-inputs-v0.1
          if-no-files-found: error
          retention-days: 90
