name: Sealed historical management source reuse v0.1

on:
  push:
    branches: [phase-3-historical-snapshot]
    paths:
      - .github/workflows/sealed-historical-management-reuse-v01.yml
      - src/momentumbot/research/sealed_historical_management_reuse_v01.py
      - scripts/verify_sealed_historical_management_reuse_v01.py
      - tests/test_sealed_historical_management_reuse_v01.py
      - research/strategy/sealed-historical-management-source-reuse-v0.1.json
      - research/strategy/sealed-historical-management-missing-inputs-v0.1.json
      - research/runtime/sealed-historical-management-source-reuse-v0.1/**

permissions:
  contents: read
  actions: read

concurrency:
  group: sealed-historical-management-reuse-v01-validation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install hash-locked verification environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-execution-quote-v01.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Validate frozen registration and focused adversarial tests
        run: |
          python scripts/verify_sealed_historical_management_reuse_v01.py --validate-registration
          python -m unittest tests.test_sealed_historical_management_reuse_v01 tests.test_sealed_historical_account_inputs_v01 tests.test_sealed_historical_micro_inputs_v01 tests.test_prospective_management_window -v
          python -O -m unittest tests.test_sealed_historical_management_reuse_v01 tests.test_sealed_historical_account_inputs_v01 tests.test_sealed_historical_micro_inputs_v01 tests.test_prospective_management_window -v
          python - <<'PY'
          from pathlib import Path
          from check_recovery_entrypoints_v13 import undefined_globals
          for name in ('scripts/verify_sealed_historical_management_reuse_v01.py', 'src/momentumbot/research/sealed_historical_management_reuse_v01.py'):
              missing = undefined_globals(Path(name).read_text(), name)
              if missing:
                  raise SystemExit(f'{name}: {sorted(missing)}')
          PY
      - name: Download the two immutable retained GitHub artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/RoomyRems/momentumbot/actions/artifacts/9995887799/zip > "$RUNNER_TEMP/retained-sip.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/9995587996/zip > "$RUNNER_TEMP/retained-bars.zip"
      - name: Independently reconstruct committed coverage from all retained source bytes offline
        run: >-
          python scripts/verify_sealed_historical_management_reuse_v01.py --verify
          --sip-zip "$RUNNER_TEMP/retained-sip.zip"
          --bars-zip "$RUNNER_TEMP/retained-bars.zip"
