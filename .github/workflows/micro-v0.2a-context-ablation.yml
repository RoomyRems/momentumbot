name: Micro v0.2a context ablation

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3-historical-snapshot
    paths:
      - src/momentumbot/research/micro_context_ablation.py
      - scripts/reconstruct_micro_v0_2a_context_case.py
      - scripts/score_micro_context_ablation_case.py
      - scripts/summarize_micro_context_ablation.py

permissions:
  contents: read

jobs:
  replay:
    name: Context runtime ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case_id: dsy-2026-06-10
            symbol: DSY
            trading_date: "2026-06-10"
          - case_id: tivc-2025-04-03
            symbol: TIVC
            trading_date: "2025-04-03"
          - case_id: upxi-2025-04-21
            symbol: UPXI
            trading_date: "2025-04-21"
          - case_id: mma-2025-09-09
            symbol: MMA
            trading_date: "2025-09-09"
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_PAPER_ENDPOINT: ${{ secrets.ALPACA_PAPER_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Reconstruct label-blind context ablation
        run: >-
          python scripts/reconstruct_micro_v0_2a_context_case.py
          --case-id "${{ matrix.case_id }}"
          --symbol "${{ matrix.symbol }}"
          --trading-date "${{ matrix.trading_date }}"
          --output "runtime-${{ matrix.case_id }}"
      - name: Require isolated ablation provenance
        run: >-
          python -c "import json,pathlib; d=json.loads(pathlib.Path('runtime-${{ matrix.case_id }}/runtime-replay.json').read_text()); assert d.get('ablation_id')=='micro-v0.2a-prequalification-context'; assert d.get('parent_frozen_policy_id')=='micro-v0.1'; assert len(d.get('ablation_fingerprint',''))==64; assert len(d.get('parent_frozen_policy_fingerprint',''))==64"
      - name: Upload label-blind ablation runtime
        uses: actions/upload-artifact@v4
        with:
          name: micro-v0.2a-context-runtime-${{ matrix.case_id }}
          path: runtime-${{ matrix.case_id }}
          if-no-files-found: error
          retention-days: 14

  score:
    name: Context score ${{ matrix.case_id }}
    needs: replay
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: dsy-2026-06-10
            benchmark: research/benchmarks/2026-06-10-dsy.json
          - case_id: tivc-2025-04-03
            benchmark: research/benchmarks/2025-04-03-tivc.json
          - case_id: upxi-2025-04-21
            benchmark: research/benchmarks/2025-04-21-upxi.json
          - case_id: mma-2025-09-09
            benchmark: research/benchmarks/2025-09-09-mma.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Download completed ablation runtime
        uses: actions/download-artifact@v4
        with:
          name: micro-v0.2a-context-runtime-${{ matrix.case_id }}
          path: runtime-${{ matrix.case_id }}
      - name: Require runtime before retrospective scoring
        run: test -s "runtime-${{ matrix.case_id }}/runtime-replay.json"
      - name: Score manifest-approved dimensions after replay
        run: >-
          python scripts/score_micro_context_ablation_case.py
          --runtime "runtime-${{ matrix.case_id }}/runtime-replay.json"
          --benchmark "${{ matrix.benchmark }}"
          --suite research/benchmarks/suites/micro-v0.1-seed.json
          --output "score-${{ matrix.case_id }}/case-score.json"
      - name: Upload post-replay ablation score
        uses: actions/upload-artifact@v4
        with:
          name: micro-v0.2a-context-score-${{ matrix.case_id }}
          path: score-${{ matrix.case_id }}
          if-no-files-found: error
          retention-days: 14

  summarize:
    name: Compare context ablation to frozen baseline
    needs: score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all post-replay ablation scores
        uses: actions/download-artifact@v4
        with:
          pattern: micro-v0.2a-context-score-*
          path: context-scores
      - name: Build baseline comparison
        run: >-
          python scripts/summarize_micro_context_ablation.py
          --root context-scores
          --baseline-summary research/benchmarks/results/micro-v0.1-seed-summary.json
          --output micro-v0.2a-context-comparison.json
      - name: Upload context-ablation comparison
        uses: actions/upload-artifact@v4
        with:
          name: micro-v0.2a-context-comparison
          path: micro-v0.2a-context-comparison.json
          if-no-files-found: error
          retention-days: 30
