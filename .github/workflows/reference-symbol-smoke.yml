name: Reference symbol smoke

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3-historical-snapshot
    paths:
      - scripts/reference_symbol_smoke.py
      - .github/workflows/reference-symbol-smoke.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_PAPER_ENDPOINT: ${{ secrets.ALPACA_PAPER_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate VRAX reference
        run: python scripts/reference_symbol_smoke.py
