name: Sealed historical execution input metadata quote v0.1

on:
  push:
    branches: [phase-3-historical-snapshot]
    paths:
      - .github/workflows/sealed-historical-execution-input-quote-v01.yml
      - requirements-sealed-execution-quote-v01.txt
      - research/strategy/sealed-historical-execution-input-quote-v0.1.json
      - research/strategy/sealed-historical-execution-input-quote-v0.1-execution.json
      - src/momentumbot/research/sealed_historical_execution_quote_v01.py
      - src/momentumbot/research/sealed_historical_metadata_transport_v01.py
      - scripts/quote_sealed_historical_execution_inputs_v01.py
      - tests/test_sealed_historical_execution_quote_v01.py

permissions:
  contents: read

concurrency:
  group: sealed-historical-execution-input-quote-v01
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.detect.outputs.execute }}
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect only the sole added execution record
        id: detect
        run: |
          python - <<'PY'
          import os, subprocess
          path = 'research/strategy/sealed-historical-execution-input-quote-v0.1-execution.json'
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          added = subprocess.check_output(['git', 'diff', '--diff-filter=A', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          execute = path in changed
          if execute and (changed != [path] or added != [path]):
              raise SystemExit('Only the sole added execution record can start a quote')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'execute={str(execute).lower()}\n')
          PY
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install hash-locked metadata environment without credentials
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-execution-quote-v01.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify exact parent and metadata-only tests normally and optimized
        run: |
          python scripts/quote_sealed_historical_execution_inputs_v01.py --validate-only
          python -m unittest tests.test_sealed_historical_execution_quote_v01 tests.test_sealed_historical_execution_inputs_v01 tests.test_prospective_market_input_quote -v
          python -O -m unittest tests.test_sealed_historical_execution_quote_v01 tests.test_sealed_historical_execution_inputs_v01 tests.test_prospective_market_input_quote -v
          python - <<'PY'
          from pathlib import Path
          from check_recovery_entrypoints_v13 import undefined_globals
          for name in ['scripts/quote_sealed_historical_execution_inputs_v01.py', 'src/momentumbot/research/sealed_historical_execution_quote_v01.py', 'src/momentumbot/research/sealed_historical_metadata_transport_v01.py']:
              missing = undefined_globals(Path(name).read_text(), name)
              if missing:
                  raise SystemExit(f'{name}: {sorted(missing)}')
          PY

  quote:
    needs: validate
    if: needs.validate.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact first-attempt execution child
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/phase-3-historical-snapshot
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git diff --name-only HEAD^ HEAD)" = research/strategy/sealed-historical-execution-input-quote-v0.1-execution.json
          test "$(git diff --diff-filter=A --name-only HEAD^ HEAD)" = research/strategy/sealed-historical-execution-input-quote-v0.1-execution.json
          printf 'EXECUTION_CODE_COMMIT_SHA=%s\n' "$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          printf 'EXECUTION_CODE_TREE_SHA=%s\n' "$(git show -s --format=%T HEAD^)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install and retain the exact locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-execution-quote-v01.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
          mkdir quote-preflight
          python -m pip freeze --all > quote-preflight/pip-freeze.txt
      - name: Validate execution and every parent byte offline
        run: python scripts/quote_sealed_historical_execution_inputs_v01.py --validate-only --check-execution
      - name: Verify successful CI and dedicated validation at the exact code parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          value = json.loads(Path('research/strategy/sealed-historical-execution-input-quote-v0.1-execution.json').read_text())
          for field, path in [('code_ci_run_id', '.github/workflows/ci.yml'), ('code_validation_run_id', '.github/workflows/sealed-historical-execution-input-quote-v01.yml')]:
              result = json.loads(subprocess.check_output(['gh', 'api', f'repos/RoomyRems/momentumbot/actions/runs/{value[field]}'], text=True))
              expected = {'head_sha': value['code_commit_sha'], 'head_branch': 'phase-3-historical-snapshot', 'event': 'push', 'run_attempt': 1, 'status': 'completed', 'conclusion': 'success', 'path': path}
              if any(result.get(k) != v for k, v in expected.items()):
                  raise SystemExit('Exact code validation run differs')
              Path(f'quote-preflight/{field}.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          PY
      - name: Atomically consume the metadata quote once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/RoomyRems/momentumbot/git/refs -f ref=refs/tags/sealed-historical-execution-input-quote-v0.1-consumed -f sha="$GITHUB_SHA" > quote-preflight/consumption-ref.json
          python scripts/quote_sealed_historical_execution_inputs_v01.py --consume --preflight-root quote-preflight
      - name: Durably upload consumption before metadata access
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-historical-execution-quote-v01-consumption-${{ github.run_id }}-${{ github.run_attempt }}
          path: quote-preflight
          if-no-files-found: error
          retention-days: 90
      - name: Quote only the exact 180 bounded metadata calls
        timeout-minutes: 12
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: python scripts/quote_sealed_historical_execution_inputs_v01.py --quote --preflight-root quote-preflight --output-root execution-quote
      - name: Retain sanitized complete or partial quote evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-historical-execution-quote-v01-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: execution-quote
          if-no-files-found: ignore
          retention-days: 90
