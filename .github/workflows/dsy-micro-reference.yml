name: DSY micro reference

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3-historical-snapshot
    paths:
      - scripts/validate_dsy_micro_reference.py
      - research/benchmarks/2026-06-10-dsy.json
      - .github/workflows/dsy-micro-reference.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_PAPER_ENDPOINT: ${{ secrets.ALPACA_PAPER_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Reconstruct DSY reference
        run: python scripts/validate_dsy_micro_reference.py --output dsy-micro-reference
      - name: Upload DSY micro reference
        uses: actions/upload-artifact@v4
        with:
          name: dsy-micro-reference-2026-06-10
          path: dsy-micro-reference
          if-no-files-found: error
          retention-days: 14
