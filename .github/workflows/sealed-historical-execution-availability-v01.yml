name: Sealed historical execution availability v0.1 validation

on:
  push:
    branches: [phase-3-historical-snapshot]
    paths:
      - .github/workflows/sealed-historical-execution-availability-v01.yml
      - requirements-sealed-execution-quote-v01.txt
      - research/strategy/sealed-historical-execution-input-availability-v0.1.json
      - src/momentumbot/research/sealed_historical_execution_availability_v01.py
      - scripts/compose_sealed_historical_execution_availability_v01.py
      - tests/test_sealed_historical_execution_availability_v01.py

permissions:
  contents: read

concurrency:
  group: sealed-historical-execution-availability-v01-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install hash-locked environment without provider credentials
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-execution-quote-v01.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Validate registration and frozen semantics offline
        run: |
          python scripts/compose_sealed_historical_execution_availability_v01.py --validate-registration
          python -m unittest tests.test_sealed_historical_execution_availability_v01 tests.test_sealed_historical_record_order_v01 tests.test_prospective_market_input_capture tests.test_prospective_daily_account_runtime tests.test_sealed_historical_execution_inputs_v01 -v
          python -O -m unittest tests.test_sealed_historical_execution_availability_v01 tests.test_sealed_historical_record_order_v01 tests.test_prospective_market_input_capture tests.test_prospective_daily_account_runtime tests.test_sealed_historical_execution_inputs_v01 -v
          python - <<'PY'
          from pathlib import Path
          from check_recovery_entrypoints_v13 import undefined_globals
          for name in ('scripts/compose_sealed_historical_execution_availability_v01.py', 'src/momentumbot/research/sealed_historical_execution_availability_v01.py'):
              missing = undefined_globals(Path(name).read_text(), name)
              if missing:
                  raise SystemExit(f'{name}: {sorted(missing)}')
          PY
