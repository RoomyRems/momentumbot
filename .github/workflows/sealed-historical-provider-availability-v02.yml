name: Sealed historical provider availability repair v0.2

on:
  push:
    branches:
      - phase-3-historical-snapshot
    paths:
      - .github/workflows/sealed-historical-provider-availability-v02.yml
      - research/strategy/sealed-historical-provider-availability-v0.2-authorization.json
      - research/data-audits/sealed-historical-provider-availability-v0.2-registration-2026-08-31.json
      - src/momentumbot/research/sealed_historical_availability_v02.py
      - scripts/probe_sealed_historical_availability_v02.py
      - tests/test_sealed_historical_availability_v02.py
      - docs/research/sealed_historical_provider_availability_v02.md
      - AGENTS.md
  workflow_dispatch:
    inputs:
      authorization_commit_sha:
        description: Full research-branch commit containing the frozen repair authorization
        required: true
        type: string
      authorization_path:
        description: Exact frozen repair authorization path
        required: true
        default: research/strategy/sealed-historical-provider-availability-v0.2-authorization.json
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization_commit_sha || github.sha }}
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install provider-free project
        run: python -m pip install -e .
      - name: Validate frozen repair without credentials
        run: python scripts/probe_sealed_historical_availability_v02.py --validate-only
      - name: Run provider-free repair tests
        run: python -m unittest tests.test_sealed_historical_availability_v02 -v
      - name: Compile repair entry points
        run: >-
          python -m py_compile
          src/momentumbot/research/sealed_historical_availability_v02.py
          scripts/probe_sealed_historical_availability_v02.py

  probe:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.authorization_commit_sha }}
      - name: Verify exact immutable repair checkout
        env:
          AUTHORIZATION_COMMIT_SHA: ${{ inputs.authorization_commit_sha }}
          AUTHORIZATION_PATH: ${{ inputs.authorization_path }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REPOSITORY" = "RoomyRems/momentumbot"
          test "$AUTHORIZATION_PATH" = "research/strategy/sealed-historical-provider-availability-v0.2-authorization.json"
          case "$AUTHORIZATION_COMMIT_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$AUTHORIZATION_COMMIT_SHA"
          git fetch --no-tags origin phase-3-historical-snapshot
          git merge-base --is-ancestor "$AUTHORIZATION_COMMIT_SHA" origin/phase-3-historical-snapshot
          test -f "$AUTHORIZATION_PATH"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install exact repair environment
        run: python -m pip install -e .
      - name: Run the exact one-call credential-routing repair
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_MAIN_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_MAIN_API_SECRET }}
        run: >-
          python scripts/probe_sealed_historical_availability_v02.py
          --authorization "${{ inputs.authorization_path }}"
          --authorization-commit-sha "${{ inputs.authorization_commit_sha }}"
          --output sealed-historical-provider-availability-v02-report.json
      - name: Upload sanitized repair report
        if: always() && hashFiles('sealed-historical-provider-availability-v02-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-historical-provider-availability-v02-${{ github.run_id }}
          path: sealed-historical-provider-availability-v02-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce repaired availability gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("sealed-historical-provider-availability-v02-report.json").read_text())
          if report.get("availability_gate_passed") is not True:
              raise SystemExit("sealed historical provider availability repair did not pass")
          if report.get("current_attempt_call_counts") != {"alpaca": 1, "total": 1}:
              raise SystemExit("sealed historical provider repair call budget mismatch")
          if report.get("massive_or_polygon_called") is not False or report.get("databento_called") is not False:
              raise SystemExit("sealed historical provider repair repeated a frozen provider gate")
          PY
