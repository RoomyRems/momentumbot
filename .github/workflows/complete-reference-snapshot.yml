name: Complete July 9 snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3-historical-snapshot
    paths:
      - scripts/build_complete_reference_snapshot.py
      - src/momentumbot/snapshot.py
      - src/momentumbot/setup.py
      - src/momentumbot/backtest.py
      - src/momentumbot/providers/marketaux.py
      - .github/workflows/complete-reference-snapshot.yml

permissions:
  contents: read

jobs:
  build-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_PAPER_ENDPOINT: ${{ secrets.ALPACA_PAPER_ENDPOINT }}
      MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Build split-normalized SEC float join
        run: python scripts/build_sec_float_join.py --output sec-float-join-artifact
      - name: Finalize SEC float classifications
        run: python scripts/finalize_sec_float_join.py --join-dir sec-float-join-artifact
      - name: Build and backtest complete snapshot
        run: python scripts/build_complete_reference_snapshot.py --date 2026-07-09 --floats sec-float-join-artifact/final_float_estimates.csv --output complete-reference-snapshot
      - name: Upload complete snapshot
        uses: actions/upload-artifact@v4
        with:
          name: complete-reference-snapshot-2026-07-09
          path: complete-reference-snapshot
          if-no-files-found: error
          retention-days: 14
