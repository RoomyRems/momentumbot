name: Sealed historical source acquisition v0.11

on:
  push:
    branches:
      - phase-3-historical-snapshot
    paths:
      - .github/workflows/sealed-historical-source-acquisition-v11.yml
      - research/strategy/sealed-historical-source-acquisition-v0.11.json
      - research/data-audits/sealed-historical-source-acquisition-v0.10-run-33706372901-failure-2026-09-04.json
      - research/data-audits/sealed-historical-source-acquisition-v0.11-parent-artifact-metadata-2026-09-04.json
      - research/data-audits/sealed-historical-source-acquisition-v0.11-registration-2026-09-04.json
      - src/momentumbot/historical_float_identity_v11.py
      - src/momentumbot/research/sealed_historical_source_artifact_metadata_v11.py
      - src/momentumbot/research/sealed_historical_source_authorization_v11.py
      - src/momentumbot/research/sealed_historical_source_acquisition_v11.py
      - scripts/validate_parent_artifact_metadata_v11.py
      - scripts/run_sealed_historical_source_acquisition_v11.py
      - tests/test_historical_float_identity_v11.py
      - tests/test_sealed_historical_source_artifact_metadata_v11.py
      - tests/test_sealed_historical_source_authorization_v11.py
      - tests/test_sealed_historical_source_acquisition_v11.py
      - tests/test_sealed_historical_source_workflow_v11.py
      - docs/research/sealed_historical_source_acquisition_v11.md
  workflow_dispatch:
    inputs:
      authorization_commit_sha:
        description: Exact research-branch commit containing frozen v0.11
        required: true
        type: string
      authorization_tree_sha:
        description: Exact Git tree for the authorized research commit
        required: true
        type: string
      authorization_path:
        description: Exact frozen v0.11 authorization path
        required: true
        default: research/strategy/sealed-historical-source-acquisition-v0.11.json
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: sealed-historical-source-acquisition-v0.11
  cancel-in-progress: false

env:
  PANEL_DATES: >-
    2025-05-30 2025-06-02 2025-06-03 2025-06-04 2025-06-05
    2025-06-06 2025-06-09 2025-06-10 2025-06-11 2025-06-12
    2025-06-13 2025-06-16 2025-06-17 2025-06-18 2025-06-20
    2025-06-23 2025-06-24 2025-06-25 2025-06-26 2025-06-27
    2025-07-01 2025-07-02 2025-07-07 2025-07-08 2025-07-10
    2025-07-11 2025-07-14 2025-07-15 2025-07-16 2025-07-17
  RECOVERY_ROOT: sealed-historical-source-acquisition-v11
  SOURCE_ROOT: sealed-historical-source-acquisition-v11/source
  CHECKPOINT_ROOT: sealed-historical-source-acquisition-v11/provider-checkpoint
  V11_RECOVERY_ROOT: sealed-historical-source-acquisition-v11/v11-recovery

jobs:
  validate:
    outputs:
      authorization_commit_sha: ${{ steps.canonical.outputs.authorization_commit_sha }}
      authorization_tree_sha: ${{ steps.canonical.outputs.authorization_tree_sha }}
      authorization_path: ${{ steps.canonical.outputs.authorization_path }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Canonicalize and strictly validate manual inputs
        id: canonical
        env:
          RAW_COMMIT: ${{ inputs.authorization_commit_sha }}
          RAW_TREE: ${{ inputs.authorization_tree_sha }}
          RAW_PATH: ${{ inputs.authorization_path }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          manual = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          commit = os.environ.get("RAW_COMMIT", "").strip() if manual else os.environ["GITHUB_SHA"]
          tree = os.environ.get("RAW_TREE", "").strip() if manual else subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()
          path = os.environ.get("RAW_PATH", "").strip() if manual else (
              "research/strategy/sealed-historical-source-acquisition-v0.11.json"
          )
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("authorization commit is not a canonical SHA")
          if re.fullmatch(r"[0-9a-f]{40}", tree) is None:
              raise SystemExit("authorization tree is not a canonical SHA")
          if path != "research/strategy/sealed-historical-source-acquisition-v0.11.json":
              raise SystemExit("authorization path changed")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"authorization_commit_sha={commit}\n")
              handle.write(f"authorization_tree_sha={tree}\n")
              handle.write(f"authorization_path={path}\n")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.canonical.outputs.authorization_commit_sha }}
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install pinned provider-free environment
        run: |
          test ! -e "$GITHUB_WORKSPACE/.venv-v11"
          python -m venv "$GITHUB_WORKSPACE/.venv-v11"
          "$GITHUB_WORKSPACE/.venv-v11/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-source-v04.txt
          echo "$GITHUB_WORKSPACE/.venv-v11/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.venv-v11/bin/python" -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          "$GITHUB_WORKSPACE/.venv-v11/bin/python" -m pip check
      - name: Verify canonical commit and tree
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.authorization_commit_sha }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ steps.canonical.outputs.authorization_tree_sha }}"
      - name: Validate frozen v0.11 child and v0.10 failure evidence
        run: python scripts/run_sealed_historical_source_acquisition_v11.py --validate-only
      - name: Run provider-free v0.11 focused and adversarial gates
        run: >-
          python -m unittest
          tests.test_historical_float_identity_v11
          tests.test_sealed_historical_source_artifact_metadata_v11
          tests.test_sealed_historical_source_authorization_v11
          tests.test_sealed_historical_source_acquisition_v11
          tests.test_sealed_historical_source_workflow_v11
          -v
      - name: Repeat v0.11 safety gates under optimized Python
        run: >-
          python -O -m unittest
          tests.test_historical_float_identity_v11
          tests.test_sealed_historical_source_artifact_metadata_v11
          tests.test_sealed_historical_source_authorization_v11
          tests.test_sealed_historical_source_acquisition_v11
          tests.test_sealed_historical_source_workflow_v11
          -v
      - name: Compile every v0.11 entry point
        run: >-
          python -m py_compile
          src/momentumbot/historical_float_identity_v11.py
          src/momentumbot/research/sealed_historical_source_artifact_metadata_v11.py
          src/momentumbot/research/sealed_historical_source_authorization_v11.py
          src/momentumbot/research/sealed_historical_source_acquisition_v11.py
          scripts/validate_parent_artifact_metadata_v11.py
          scripts/run_sealed_historical_source_acquisition_v11.py

  freeze:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: validate
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.authorization_commit_sha }}
      - name: Verify exact immutable provider-free checkout and dispatcher
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "RoomyRems/momentumbot"
          test "$GITHUB_WORKFLOW_REF" = "RoomyRems/momentumbot/.github/workflows/sealed-historical-source-acquisition-v11.yml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.authorization_commit_sha }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.validate.outputs.authorization_tree_sha }}"
          test "$(git rev-parse origin/phase-3-historical-snapshot)" = "${{ needs.validate.outputs.authorization_commit_sha }}"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse "${GITHUB_WORKFLOW_SHA}:.github/workflows/sealed-historical-source-acquisition-v11.yml")" = "$(git hash-object .github/workflows/sealed-historical-source-acquisition-v11.yml)"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Verify exact retained v0.10 provider checkpoint metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$V11_RECOVERY_ROOT"
          metadata="$RUNNER_TEMP/v11-parent-artifact-metadata.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9877181150" > "$metadata"
          python scripts/validate_parent_artifact_metadata_v11.py \
            --metadata-json "$metadata" \
            --receipt-output "$V11_RECOVERY_ROOT/artifact-metadata-receipt.json"
      - name: Download exact v0.10 provider checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sealed-historical-source-acquisition-v10-provider-checkpoint-33706372901-1
          path: sealed-historical-source-acquisition-v11
          github-token: ${{ github.token }}
          repository: RoomyRems/momentumbot
          run-id: 33706372901
      - name: Recreate and compare exact provider-free environment
        run: |
          python -m venv "$GITHUB_WORKSPACE/.venv-v11"
          "$GITHUB_WORKSPACE/.venv-v11/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-source-v04.txt
          echo "$GITHUB_WORKSPACE/.venv-v11/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.venv-v11/bin/python" -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          "$GITHUB_WORKSPACE/.venv-v11/bin/python" -m pip check
          mkdir -p "$V11_RECOVERY_ROOT/environment"
          "$GITHUB_WORKSPACE/.venv-v11/bin/python" -m pip freeze --all | LC_ALL=C sort > "$V11_RECOVERY_ROOT/environment/pip-freeze.txt"
          cmp -s requirements-sealed-source-v04.txt "$CHECKPOINT_ROOT/environment/requirements-sealed-source-v04.txt"
          python - <<'PY'
          import os
          from momentumbot.research.sealed_historical_source_acquisition_v11 import validate_recovery_environment_pair_v11

          validate_recovery_environment_pair_v11(
              parent_environment_freeze_path=os.environ["CHECKPOINT_ROOT"] + "/environment/pip-freeze.txt",
              child_environment_freeze_path=os.environ["V11_RECOVERY_ROOT"] + "/environment/pip-freeze.txt",
              expected_child_commit_sha="${{ needs.validate.outputs.authorization_commit_sha }}",
          )
          PY
      - name: Rehash and deeply validate exact 706-file provider checkpoint
        run: |
          python scripts/build_sealed_historical_source_checkpoint_v10.py \
            --validate-existing \
            --source-root "$SOURCE_ROOT" \
            --parent-recovery-receipt "$CHECKPOINT_ROOT/parent-recovery-receipt.json" \
            --normalization-diagnostics "$CHECKPOINT_ROOT/float-normalization-rejections.json" \
            --request-budget "$CHECKPOINT_ROOT/request-budget.json" \
            --blocked-attempt-ledger "$CHECKPOINT_ROOT/blocked-attempts.json" \
            --authorization research/strategy/sealed-historical-source-acquisition-v0.10.json \
            --authorization-commit-sha 652db5675a35b6f455aa0d924aa50428dd995280 \
            --authorization-tree-sha 48092229da6a5cf2dd24de6fe4f98584e6de68e3 \
            --dispatcher-workflow-sha 8b920876d9a513f31d6fdb6795c4155a2c1a1519 \
            --dispatcher-workflow-ref RoomyRems/momentumbot/.github/workflows/sealed-historical-source-acquisition-v10.yml@refs/heads/main \
            --repository RoomyRems/momentumbot \
            --workflow-run-id 33706372901 \
            --workflow-run-attempt 1 \
            --environment-freeze "$CHECKPOINT_ROOT/environment/pip-freeze.txt" \
            --requirements "$CHECKPOINT_ROOT/environment/requirements-sealed-source-v04.txt" \
            --output "$CHECKPOINT_ROOT/source-checkpoint.json"
      - name: Freeze scanner snapshots from canonical inputs without credentials
        run: >-
          python scripts/build_causal_scanner_snapshot_v10.py
          --phase freeze-snapshots
          --census-root "$SOURCE_ROOT"
          --dates $PANEL_DATES
          --asset-batch-size 250
          --max-candidates-per-date 100
          --source-input-output "$SOURCE_ROOT/causal-scanner-source-inputs-v0.2"
          --output "$SOURCE_ROOT/causal-scanner-snapshot-v0.3"
      - name: Build identity-compatible strict final deep replay without credentials
        run: >-
          python scripts/run_sealed_historical_source_acquisition_v11.py
          --authorization "${{ needs.validate.outputs.authorization_path }}"
          --source-root "$SOURCE_ROOT"
          --source-checkpoint "$CHECKPOINT_ROOT/source-checkpoint.json"
          --parent-recovery-receipt "$CHECKPOINT_ROOT/parent-recovery-receipt.json"
          --normalization-diagnostics "$CHECKPOINT_ROOT/float-normalization-rejections.json"
          --request-budget "$CHECKPOINT_ROOT/request-budget.json"
          --blocked-attempt-ledger "$CHECKPOINT_ROOT/blocked-attempts.json"
          --parent-environment-freeze "$CHECKPOINT_ROOT/environment/pip-freeze.txt"
          --child-environment-freeze "$V11_RECOVERY_ROOT/environment/pip-freeze.txt"
          --requirements "$CHECKPOINT_ROOT/environment/requirements-sealed-source-v04.txt"
          --authorization-commit-sha "${{ needs.validate.outputs.authorization_commit_sha }}"
          --authorization-tree-sha "${{ needs.validate.outputs.authorization_tree_sha }}"
          --dispatcher-workflow-sha "${{ github.workflow_sha }}"
          --dispatcher-workflow-ref "${{ github.workflow_ref }}"
          --output "$RECOVERY_ROOT/recovery-report.json"
      - name: Upload completed normalized canonical and audited source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-historical-source-acquisition-v11-${{ github.run_id }}-${{ github.run_attempt }}
          path: sealed-historical-source-acquisition-v11
          if-no-files-found: error
          retention-days: 90
      - name: Build sanitized provider-free failure accounting
        if: failure() || cancelled()
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          python scripts/run_sealed_historical_source_acquisition_v11.py
          --write-safe-failure
          --authorization "${{ needs.validate.outputs.authorization_path }}"
          --source-root "$SOURCE_ROOT"
          --authorization-commit-sha "${{ needs.validate.outputs.authorization_commit_sha }}"
          --authorization-tree-sha "${{ needs.validate.outputs.authorization_tree_sha }}"
          --dispatcher-workflow-sha "${{ github.workflow_sha }}"
          --dispatcher-workflow-ref "${{ github.workflow_ref }}"
          --output "$RECOVERY_ROOT/safe-failure.json"
      - name: Preserve sanitized provider-free failure accounting
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-historical-source-acquisition-v11-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: sealed-historical-source-acquisition-v11/safe-failure.json
          if-no-files-found: error
          retention-days: 90
