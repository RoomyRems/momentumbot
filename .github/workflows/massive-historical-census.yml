          assert all(all(link['previous_link_sha256']==('' if i==0 else x['source_hash_chain'][i-1]['link_sha256']) and link['link_sha256']==h({'name':link['name'],'source_sha256':link['source_sha256'],'previous_link':link['previous_link_sha256']}) for i,link in enumerate(x['source_hash_chain'])) for x in s['date_manifests']);
          assert all(all(len(link['source_sha256'])==64 and link['source_sha256']==link['source_sha256'].lower() for link in x['source_hash_chain']) for x in s['date_manifests']);
