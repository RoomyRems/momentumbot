          expected_members={'2025-04-03':5442,'2026-07-09':5571};
          source_order=['identity_resolved_membership','market_candidates','market_discovery_manifest','causal_float_records','causal_float_manifest','publication_timed_news_events','publication_timed_news_statuses','publication_timed_news_manifest','reacquired_market_inputs'];
          assert all(x['schema_version']==1 and x['artifact_id']=='causal-scanner-snapshot-v0.1' for x in s['date_manifests']);
          assert all(x['content_sha256']==h({k:v for k,v in x.items() if k!='content_sha256'}) for x in s['date_manifests']);
