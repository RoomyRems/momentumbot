          assert all([link['source_sha256'] for link in sm[d]['source_hash_chain'][:8]]==[qdm[d]['source_membership']['membership_sha256'],qcp[d]['content_sha256'],h(qdm[d]),fdm[d]['summary']['records_sha256'],h(fdm[d]),ndm[d]['summary']['full_window_events_sha256'],ndm[d]['summary']['qualification_statuses_sha256'],h(ndm[d])] for d in s['dates']);
          sp=[json.loads((root/'causal-scanner-snapshot-v0.1'/x['trading_date']/x['files']['scanner_records']).read_text()) for x in s['date_manifests']];
          assert all(p['content_sha256']==h({k:v for k,v in p.items() if k!='content_sha256'}) for p in sp);
          assert all(p['ordered_records_sha256']==h(p['rows']) for p in sp);
          assert all(p['row_count']==len(p['rows']) and p['candidate_count']==m['summary']['market_candidate_count'] for p,m in zip(sp,s['date_manifests']));
          assert all(p['identity_resolved_member_count']==expected_members[p['trading_date']] for p in sp);
          assert all(p['ordered_records_sha256']==m['summary']['ordered_records_sha256'] and p['content_sha256']==m['summary']['records_content_sha256'] for p,m in zip(sp,s['date_manifests']));
          dt=__import__('datetime');
          zi=__import__('zoneinfo').ZoneInfo('America/New_York');
          expected_rows={d:sum(int((dt.datetime.combine(dt.date.fromisoformat(d),dt.time.fromisoformat(qdm[d]['strategy_profile']['no_new_entries_after']),zi)-dt.datetime.fromisoformat(row['first_market_qualified_at'])).total_seconds()//60) for row in qcp[d]['rows']) for d in s['dates']};
          assert all(sm[d]['summary']['expected_candidate_minute_disposition_count']==expected_rows[d] for d in s['dates']);
          assert all(all(dt.datetime.fromisoformat(row['decision_time'])-dt.datetime.fromisoformat(row['required_source_bar_started_at'])==dt.timedelta(seconds=60) for row in p['rows']) for p in sp);
          assert all(all(row['float_asof'] is None or dt.datetime.fromisoformat(row['float_asof'])<=dt.datetime.fromisoformat(row['activation_time']) for row in p['rows']) for p in sp);
          assert all(all(all(row[k] is None or dt.datetime.fromisoformat(row[k])<=dt.datetime.fromisoformat(row['decision_time']) for k in ['first_provider_news_published_at_as_of','latest_provider_news_published_at_as_of']) for row in p['rows']) for p in sp);
          assert all(all(row['rank_members_with_completed_bar_count']+row['rank_members_without_completed_bar_count']==row['identity_resolved_member_count'] and row['rank_members_with_completed_close_count']+row['rank_members_missing_completed_close_count']==row['rank_members_with_completed_bar_count'] and row['rank_members_with_computable_gain_count']+row['rank_members_missing_previous_close_count']==row['rank_members_with_completed_close_count'] for row in p['rows']) for p in sp)"
      - name: Upload historical census prototype
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: massive-historical-census-prototype
          path: massive-historical-census
          if-no-files-found: error
          retention-days: 30
