name: Massive historical ticker census

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3-historical-snapshot
    paths:
      - src/momentumbot/providers/massive.py
      - scripts/build_massive_historical_census.py
      - tests/test_massive_provider.py
      - tests/test_build_massive_historical_census.py
      - scripts/audit_massive_alpaca_market_coverage.py
      - tests/test_massive_market_coverage.py
      - src/momentumbot/instrument_metadata.py
      - scripts/audit_massive_instrument_metadata.py
      - tests/test_instrument_metadata.py
      - src/momentumbot/historical_universe.py
      - scripts/build_massive_provisional_universe.py
      - tests/test_historical_universe.py
      - tests/test_build_massive_provisional_universe.py
      - src/momentumbot/identity_continuity.py
      - scripts/audit_historical_identity_continuity.py
      - tests/test_identity_continuity.py
      - tests/test_historical_identity_audit.py
      - src/momentumbot/identity_resolved_universe.py
      - scripts/build_identity_resolved_universe.py
      - tests/test_identity_resolved_universe.py
      - tests/test_build_identity_resolved_universe.py
      - src/momentumbot/causal_market_discovery.py
      - src/momentumbot/historical_data.py
      - scripts/build_identity_resolved_market_discovery.py
      - tests/test_causal_market_discovery.py
      - tests/test_historical_data.py
      - src/momentumbot/historical_float.py
      - src/momentumbot/providers/sec_edgar.py
      - scripts/edgar_smoke.py
      - scripts/build_causal_float_enrichment.py
      - scripts/build_sec_float_join.py
      - tests/test_historical_float.py
      - tests/test_build_causal_float_enrichment.py
      - tests/test_sec_edgar.py
      - tests/test_sec_float_join.py
      - src/momentumbot/providers/alpaca.py
      - src/momentumbot/historical_news.py
      - scripts/build_causal_news_enrichment.py
      - tests/test_alpaca_provider.py
      - tests/test_historical_news.py
      - research/data-audits/massive-identity-corporate-actions-v0.1-2026-08-16.json
      - .github/workflows/massive-historical-census.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_PAPER_ENDPOINT: ${{ secrets.ALPACA_PAPER_ENDPOINT }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Test census client and builder contracts
        run: >-
          python -m unittest
          tests.test_massive_provider
          tests.test_build_massive_historical_census
          tests.test_massive_market_coverage
          tests.test_instrument_metadata
          tests.test_historical_universe
          tests.test_build_massive_provisional_universe
          tests.test_identity_continuity
          tests.test_historical_identity_audit
          tests.test_identity_resolved_universe
          tests.test_build_identity_resolved_universe
          tests.test_causal_market_discovery
          tests.test_historical_data
          tests.test_historical_float
          tests.test_build_causal_float_enrichment
          tests.test_sec_edgar
          tests.test_sec_float_join
          tests.test_alpaca_provider
          tests.test_historical_news
          -v
      - name: Verify declared SEC fair-access identity
        run: python scripts/edgar_smoke.py
      - name: Fetch fully paginated historical censuses
        run: >-
          python scripts/build_massive_historical_census.py
          --dates 2025-04-03 2026-07-09
          --minimum-request-interval 12.5
          --limit 1000
          --output massive-historical-census
      - name: Audit instrument metadata semantics
        run: >-
          python scripts/audit_massive_instrument_metadata.py
          --census-root massive-historical-census
      - name: Audit Alpaca historical daily-bar coverage
        run: >-
          python scripts/audit_massive_alpaca_market_coverage.py
          --census-root massive-historical-census
          --batch-size 250
      - name: Build provisional point-in-time universe
        run: >-
          python scripts/build_massive_provisional_universe.py
          --census-root massive-historical-census
      - name: Audit historical identity and corporate actions
        run: >-
          python scripts/audit_historical_identity_continuity.py
          --census-root massive-historical-census
          --lookback-days 120
          --batch-size 200
          --minimum-massive-request-interval 12.5
          --ticker-event-sample-size 10
      - name: Build frozen identity-resolved universe
        run: >-
          python scripts/build_identity_resolved_universe.py
          --census-root massive-historical-census
          --expected-audit-result
          research/data-audits/massive-identity-corporate-actions-v0.1-2026-08-16.json
      - name: Build label-blind causal market discovery
        run: >-
          python scripts/build_identity_resolved_market_discovery.py
          --census-root massive-historical-census
          --dates 2025-04-03 2026-07-09
          --asset-batch-size 250
      - name: Build causal point-in-time SEC float enrichment
        run: >-
          python scripts/build_causal_float_enrichment.py
          --census-root massive-historical-census
          --dates 2025-04-03 2026-07-09
          --minimum-sec-request-interval 0.2
          --sec-attempts 3
      - name: Build provider-relative publication-timed news v0.2
        run: >-
          python scripts/build_causal_news_enrichment.py
          --census-root massive-historical-census
          --dates 2025-04-03 2026-07-09
          --news-batch-size 50
      - name: Enforce research-only eligibility
        run: >-
          python -c "import json,pathlib;
          root=pathlib.Path('massive-historical-census');
          d=json.loads((root/'manifest.json').read_text());
          assert d['all_fetches_complete'] is True;
          assert d['universe_complete'] is False;
          assert d['full_walk_forward_eligible'] is False;
          assert d['policy_promotion_eligible'] is False;
          assert all(x['eligibility']['point_in_time_membership_candidate'] is True for x in d['date_manifests']);
          assert all(x['eligibility']['universe_complete'] is False for x in d['date_manifests']);
          assert all(x['census_summary']['unrecognized_security_type_row_count']==0 for x in d['date_manifests']);
          c=json.loads((root/'market-data-coverage'/'manifest.json').read_text());
          assert c['universe_complete'] is False;
          assert c['full_walk_forward_eligible'] is False;
          assert c['policy_promotion_eligible'] is False;
          m=json.loads((root/'instrument-metadata-audit'/'manifest.json').read_text());
          assert m['instrument_translation_frozen'] is False;
          assert m['universe_complete'] is False;
          assert m['full_walk_forward_eligible'] is False;
          assert m['policy_promotion_eligible'] is False;
          u=json.loads((root/'provisional-universe-v0.1'/'manifest.json').read_text());
          assert u['complete_relative_to_census'] is True;
          assert u['universe_complete'] is False;
          assert u['full_walk_forward_eligible'] is False;
          assert u['policy_promotion_eligible'] is False;
          i=json.loads((root/'identity-continuity-v0.1'/'manifest.json').read_text());
          assert i['knowledge_policy']['uses_benchmark_labels'] is False;
          assert isinstance(i['eligibility']['identity_gate_passes_after_explicit_quarantine'],bool);
          assert i['eligibility']['full_feature_snapshot_candidate'] is i['eligibility']['identity_gate_passes_after_explicit_quarantine'];
          assert i['eligibility']['universe_complete'] is False;
          assert i['eligibility']['full_walk_forward_eligible'] is False;
          assert i['eligibility']['policy_promotion_eligible'] is False;
          r=json.loads((root/'identity-resolved-universe-v0.1'/'manifest.json').read_text());
          assert r['eligibility']['complete_relative_to_provisional_membership'] is True;
          assert r['eligibility']['identity_gate_pass'] is True;
          assert r['eligibility']['full_feature_snapshot_candidate'] is True;
          assert r['eligibility']['universe_complete'] is False;
          assert r['eligibility']['full_walk_forward_eligible'] is False;
          assert r['eligibility']['policy_promotion_eligible'] is False;
          assert r['date_summaries']['2025-04-03']['identity_accepted_ticker_count']==5442;
          assert r['date_summaries']['2026-07-09']['identity_accepted_ticker_count']==5571;
          assert r['date_summaries']['2025-04-03']['identity_quarantine_tickers']==['FRMEP','LBTYA','LBTYB','LBTYK','LILA','LILAK'];
          assert r['date_summaries']['2026-07-09']['identity_quarantine_tickers']==['FRMEP','LBTYA','LBTYB','LBTYK','LILA','LILAK'];
          q=json.loads((root/'causal-market-discovery-v0.2'/'manifest.json').read_text());
          assert q['schema_version']==2;
          assert q['artifact_id']=='causal-market-discovery-v0.2';
          assert q['discovery_policy']['supersedes_policy_id']=='causal-market-discovery-v0.1';
          assert q['discovery_policy']['supersedes_policy_fingerprint']=='b6628f08eff913fbe30f465a9792d71fe4f70ac028ea23e4858277bb6068da1e';
          assert q['discovery_policy']['fingerprint']=='dbcbebae2b785ef8af68a37122658e02aa6fec3310c03581426273c5b66516d5';
          assert q['eligibility']['causal_market_discovery_complete'] is True;
          assert q['eligibility']['full_feature_snapshot_complete'] is False;
          assert q['eligibility']['universe_complete'] is False;
          assert q['eligibility']['full_walk_forward_eligible'] is False;
          assert q['eligibility']['policy_promotion_eligible'] is False;
          assert q['knowledge_policy']['uses_benchmark_labels'] is False;
          assert q['knowledge_policy']['uses_retrospective_trade_outcomes'] is False;
          assert q['knowledge_policy']['selection_applied'] is False;
          assert q['date_manifests'][0]['summary']['identity_resolved_ticker_count']==5442;
          assert q['date_manifests'][1]['summary']['identity_resolved_ticker_count']==5571;
          assert q['date_manifests'][0]['summary']['acquisition_decision_count']==5442;
          assert q['date_manifests'][1]['summary']['acquisition_decision_count']==5571;
          assert all(x['acquisition']['prefilter_values_exposed_to_runtime_strategy'] is False for x in q['date_manifests']);
          assert all(x['schema_version']==2 for x in q['date_manifests']);
          assert all(x['acquisition']['minute_bar_timestamp_semantics']=='bar_start' for x in q['date_manifests']);
          assert all(x['acquisition']['decision_availability_offset_seconds']==60 for x in q['date_manifests']);
          assert all(x['acquisition']['scan_window_applies_to']=='decision_availability_timestamp' for x in q['date_manifests']);
          qc=[json.loads((root/'causal-market-discovery-v0.2'/x['trading_date']/x['files']['market_candidates']).read_text()) for x in q['date_manifests']];
          assert all(x['schema_version']==2 and x['artifact_id']=='causal-market-candidates-v0.2' for x in qc);
          assert all(all(__import__('datetime').datetime.fromisoformat(r['first_market_qualified_at'])-__import__('datetime').datetime.fromisoformat(r['first_market_qualified_bar_started_at'])==__import__('datetime').timedelta(seconds=60) for r in x['rows']) for x in qc);
          f=json.loads((root/'causal-sec-float-v0.1'/'manifest.json').read_text());
          assert f['eligibility']['complete_relative_to_market_candidates'] is True;
          assert f['eligibility']['point_in_time_float_decisions_frozen'] is True;
          assert f['eligibility']['publication_timed_news_complete'] is False;
          assert f['eligibility']['full_feature_snapshot_complete'] is False;
          assert f['eligibility']['universe_complete'] is False;
          assert f['eligibility']['full_walk_forward_eligible'] is False;
          assert f['eligibility']['policy_promotion_eligible'] is False;
          assert f['knowledge_policy']['uses_benchmark_labels'] is False;
          assert f['knowledge_policy']['uses_future_filings'] is False;
          assert f['knowledge_policy']['raw_future_disclosures_persisted'] is False;
          assert f['knowledge_policy']['unknown_float_fails_closed'] is True;
          assert f['fatal_provider_errors']==[];
          qm={x['trading_date']:x for x in q['date_manifests']};
          assert all(x['summary']['market_candidate_count']==qm[x['trading_date']]['summary']['causal_market_candidate_count'] for x in f['date_manifests']);
          assert all(x['summary']['float_decision_count']==x['summary']['market_candidate_count'] for x in f['date_manifests']);
          assert all(x['summary']['provider_error_count']==0 for x in f['date_manifests']);
          assert all(x['summary']['float_pass_count']+x['summary']['float_fail_count']+x['summary']['float_unknown_fail_closed_count']==x['summary']['float_decision_count'] for x in f['date_manifests']);
          assert all(x['knowledge_policy']['uses_benchmark_labels'] is False for x in f['date_manifests']);
          assert all(x['knowledge_policy']['uses_future_filings'] is False for x in f['date_manifests']);
          assert all(x['knowledge_policy']['raw_future_disclosures_persisted'] is False for x in f['date_manifests']);
          assert all(x['knowledge_policy']['unknown_float_fails_closed'] is True for x in f['date_manifests']);
          n=json.loads((root/'causal-alpaca-news-v0.2'/'manifest.json').read_text());
          assert n['schema_version']==2;
          assert n['artifact_id']=='causal-alpaca-news-v0.2';
          assert n['news_policy']['supersedes_policy_id']=='causal-alpaca-news-v0.1';
          assert n['news_policy']['supersedes_policy_fingerprint']=='7f0197a411f418d766e6a294d5cb3ef877b640746ab9de1f4d8f214a3a19df2f';
          assert n['temporal_boundary']['as_of_projection_rule']=='published_at <= decision_time';
          assert n['temporal_boundary']['candidate_decision_time_field']=='first_market_qualified_at';
          assert n['temporal_boundary']['candidate_decision_time_semantics']=='decision_availability_after_completed_source_bar';
          assert n['temporal_boundary']['runtime_consumers_must_project_full_window_tape'] is True;
          assert n['temporal_boundary']['post_qualification_events_available_to_earlier_decisions'] is False;
          assert n['eligibility']['complete_relative_to_provider'] is True;
          assert n['eligibility']['publication_timed_news_frozen'] is True;
          assert n['eligibility']['full_feature_snapshot_complete'] is False;
          assert n['eligibility']['universe_complete'] is False;
          assert n['eligibility']['full_walk_forward_eligible'] is False;
          assert n['eligibility']['policy_promotion_eligible'] is False;
          assert n['knowledge_policy']['uses_benchmark_labels'] is False;
          assert n['knowledge_policy']['uses_retrospective_trade_outcomes'] is False;
          assert n['knowledge_policy']['qualification_status_uses_future_publications'] is False;
          assert n['knowledge_policy']['full_window_tape_is_runtime_safe_without_projection'] is False;
          assert n['knowledge_policy']['candidate_acquisition_depends_on_news'] is False;
          assert n['knowledge_policy']['absence_means_no_news_in_all_sources'] is False;
          assert n['fatal_provider_errors']==[];
          fm={x['trading_date']:x for x in f['date_manifests']};
          assert all(x['summary']['market_candidate_count']==fm[x['trading_date']]['summary']['float_decision_count'] for x in n['date_manifests']);
          assert all(x['schema_version']==2 for x in n['date_manifests']);
          assert all(x['summary']['qualification_status_count']==x['summary']['market_candidate_count'] for x in n['date_manifests']);
          assert all(x['summary']['provider_error_count']==0 for x in n['date_manifests']);
          assert all(x['summary']['candidates_unknown_fail_closed_at_market_qualification_count']==0 for x in n['date_manifests']);
          assert all(x['summary']['candidates_with_news_at_market_qualification_count']+x['summary']['candidates_with_provider_relative_no_news_at_market_qualification_count']+x['summary']['candidates_unknown_fail_closed_at_market_qualification_count']==x['summary']['market_candidate_count'] for x in n['date_manifests']);
          assert all(x['summary']['full_window_post_qualification_candidate_event_count']>=x['summary']['candidates_with_post_qualification_tape_events_count'] for x in n['date_manifests']);
          assert all(x['files']['news_records_schema']=='full_window_event_tape_plus_as_of_qualification_statuses' for x in n['date_manifests']);
          assert all(x['knowledge_policy']['uses_benchmark_labels'] is False for x in n['date_manifests']);
          assert all(x['knowledge_policy']['qualification_status_uses_future_publications'] is False for x in n['date_manifests']);
          assert all(x['knowledge_policy']['full_window_tape_is_runtime_safe_without_projection'] is False for x in n['date_manifests']);
          assert all(x['knowledge_policy']['full_window_tape_contains_post_qualification_events'] is (x['summary']['full_window_post_qualification_candidate_event_count']>0) for x in n['date_manifests']);
          assert all(x['knowledge_policy']['candidate_acquisition_depends_on_news'] is False for x in n['date_manifests']);
          assert all(x['knowledge_policy']['absence_means_no_news_in_all_sources'] is False for x in n['date_manifests'])"
      - name: Upload historical census prototype
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: massive-historical-census-prototype
          path: massive-historical-census
          if-no-files-found: error
          retention-days: 30
