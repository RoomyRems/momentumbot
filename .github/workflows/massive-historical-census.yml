          assert all(x['knowledge_policy']['absence_means_no_news_in_all_sources'] is False for x in n['date_manifests']);
          h=lambda x: __import__('hashlib').sha256(json.dumps(x,ensure_ascii=True,separators=(',',':'),sort_keys=True).encode()).hexdigest();
          s=json.loads((root/'causal-scanner-snapshot-v0.1'/'manifest.json').read_text());
          assert s['schema_version']==1;
          assert s['artifact_id']=='causal-scanner-snapshot-v0.1';
          assert s['dates']==['2025-04-03','2026-07-09'];
          assert s['scanner_policy']['fingerprint']=='ed21becad10855b4a085b6e05b6feac8f21e4ce511a100b2381522154818f42a';
          assert s['content_sha256']==h({k:v for k,v in s.items() if k!='content_sha256'});
          assert s['eligibility']['complete_relative_to_identity_resolved_membership'] is True;
          assert s['eligibility']['candidate_minute_dispositions_frozen'] is True;
          assert s['eligibility']['universe_complete'] is False;
          assert s['eligibility']['full_walk_forward_eligible'] is False;
          assert s['eligibility']['policy_promotion_eligible'] is False;
          assert s['knowledge_policy']['uses_benchmark_labels'] is False;
          assert s['knowledge_policy']['uses_retrospective_trade_outcomes'] is False;
          assert s['knowledge_policy']['future_session_extrema_used_as_snapshot_feature'] is False;
          assert s['knowledge_policy']['source_market_full_day_high_used_for_acquisition_only'] is True;
          assert s['knowledge_policy']['source_acquisition_prefilter_exposed_to_snapshot'] is False;
          assert s['knowledge_policy']['contains_trades_setups_portfolio_or_pnl'] is False;
          assert s['source_replay_boundary']['raw_reacquired_market_inputs_persisted'] is False;
          assert s['source_replay_boundary']['reacquired_market_inputs_sha256_role']=='integrity_commitment_only';
          assert s['source_replay_boundary']['independent_feature_recomputation_from_snapshot_artifact'] is False;
          assert s['source_replay_boundary']['source_provider_replay_required_for_recomputation'] is True;
          assert s['source_bundle_hashes']=={'membership':r['content_sha256'],'market':q['content_sha256'],'float':f['content_sha256'],'news':n['content_sha256']};
          assert len(s['date_manifests'])==2;
          qdm={x['trading_date']:x for x in q['date_manifests']};
