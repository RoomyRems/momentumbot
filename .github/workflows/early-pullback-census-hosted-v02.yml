name: Early pullback census hosted v0.2

on:
  push:
    branches: [phase-3-historical-snapshot]
    paths:
      - research/strategy/early-pullback-census-hosted-v0.2-execution.json

permissions:
  contents: read

concurrency:
  group: early-pullback-census-hosted-v02
  cancel-in-progress: false

jobs:
  consume:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      artifact_id: ${{ steps.preserve.outputs.artifact-id }}
      inventory_sha256: ${{ steps.prepare.outputs.inventory_sha256 }}
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install frozen provider-free runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-source-v04.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Validate registration and exact sole-file execution
        run: python scripts/run_early_pullback_census_hosted_v02.py --validate-only --check-execution
      - name: Test launcher and census mechanics without providers
        run: |
          python -m unittest tests.test_early_pullback_census_hosted_v02 tests.test_early_pullback_census_v01 -v
          python -O -m unittest tests.test_early_pullback_census_hosted_v02 tests.test_early_pullback_census_v01 -v
      - name: Verify exact-parent CI and every job step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir census-preflight
          CI_RUN=$(python -c 'from pathlib import Path; from momentumbot.research import early_pullback_census_hosted_v02 as m; print(m.base.frozen(Path(m.EXECUTION_PATH))["successful_code_ci_run_id"])')
          gh api "repos/RoomyRems/momentumbot/actions/runs/$CI_RUN" > census-preflight/parent-ci.json
          gh api "repos/RoomyRems/momentumbot/actions/runs/$CI_RUN/jobs?per_page=100" > census-preflight/parent-ci-jobs.json
          python - <<'PY'
          from pathlib import Path
          from momentumbot.research import early_pullback_census_hosted_v02 as m
          m.validate_ci(m.base.json_object(Path('census-preflight/parent-ci.json').read_bytes()), m.base.json_object(Path('census-preflight/parent-ci-jobs.json').read_bytes()), m.base.frozen(Path(m.EXECUTION_PATH)))
          PY
      - name: Atomically consume the separately approved census authority
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/RoomyRems/momentumbot/git/refs -f ref=refs/tags/early-pullback-census-hosted-v0.2-consumed -f sha="$GITHUB_SHA" > census-preflight/consumption-ref.json
          python scripts/run_early_pullback_census_hosted_v02.py --prepare --preflight census-preflight
      - name: Retain consumption before credential access
        id: preserve
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: early-pullback-census-hosted-v02-consumption-${{ github.run_id }}-${{ github.run_attempt }}
          path: census-preflight
          if-no-files-found: error
          retention-days: 90

  capture:
    if: github.run_attempt == 1
    needs: consume
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
      CENSUS_PREFLIGHT_ARTIFACT_ID: ${{ needs.consume.outputs.artifact_id }}
      CENSUS_PREFLIGHT_SHA256: ${{ needs.consume.outputs.inventory_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install same frozen runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-source-v04.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Download exact consumption artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.consume.outputs.artifact_id }}
          path: census-preflight
          merge-multiple: true
      - name: Observe live permanent ref and exact artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/RoomyRems/momentumbot/git/ref/tags/early-pullback-census-hosted-v0.2-consumed > census-current-ref.json
          gh api "repos/RoomyRems/momentumbot/actions/artifacts/$CENSUS_PREFLIGHT_ARTIFACT_ID" > census-artifact-metadata.json
      - name: Validate all gates then execute the bounded census once
        timeout-minutes: 330
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/run_early_pullback_census_hosted_v02.py --capture --preflight census-preflight --output census-result --live-ref census-current-ref.json --artifact-metadata census-artifact-metadata.json
      - name: Preserve complete or partial raw capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: early-pullback-census-hosted-v02-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: census-result/capture
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Preserve launch linkage separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: early-pullback-census-hosted-v02-linkage-${{ github.run_id }}-${{ github.run_attempt }}
          path: census-result/launch
          if-no-files-found: warn
          retention-days: 90
