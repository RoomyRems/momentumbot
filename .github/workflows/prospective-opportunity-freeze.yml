name: Prospective opportunity freeze

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Same-repository Actions run containing the frozen daily decision source
        required: true
        type: string
      source_artifact_name:
        description: Exact source artifact name
        required: true
        default: prospective-daily-micro-decision-source
        type: string
      trading_date:
        description: Registered prospective trading date (YYYY-MM-DD)
        required: true
        type: string
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      source_artifact_name:
        required: true
        type: string
      trading_date:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Download frozen source from the named run
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          path: source
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Materialize label-blind opportunity and request manifests
        env:
          EXPECTED_TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          python scripts/freeze_prospective_opportunities.py \
            --source source/prospective-daily-micro-decision-source.json \
            --expected-trading-date "$EXPECTED_TRADING_DATE" \
            --output-dir prospective-opportunity-freeze
      - name: Verify deterministic freeze mechanics
        run: python -m unittest tests.test_prospective_opportunity_freeze -v
      - name: Upload immutable handoff
        uses: actions/upload-artifact@v4
        with:
          name: prospective-opportunity-freeze-${{ inputs.trading_date }}
          path: prospective-opportunity-freeze/
          if-no-files-found: error
          retention-days: 90
