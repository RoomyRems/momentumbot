name: Sealed historical management capture validation v0.1

on:
  push:
    branches: [phase-3-historical-snapshot]
    paths:
      - .github/workflows/sealed-historical-management-capture-validation-v01.yml
      - .github/workflows/sealed-historical-management-input-acquisition-v01.yml
      - src/momentumbot/research/sealed_historical_management_capture_v01.py
      - scripts/capture_sealed_historical_management_inputs_v01.py
      - tests/test_sealed_historical_management_capture_v01.py
      - research/strategy/sealed-historical-management-missing-input-acquisition-v0.1.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install the frozen verification environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-execution-quote-v01.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify frozen registration and audited reuse result offline
        run: |
          python scripts/capture_sealed_historical_management_inputs_v01.py --validate-only
          python scripts/capture_sealed_historical_management_inputs_v01.py --verify-reuse
      - name: Test transport boundaries and complete synthetic acquisition under normal and optimized Python
        run: |
          python -m unittest tests.test_sealed_historical_management_capture_v01 tests.test_sealed_historical_management_reuse_v01 tests.test_sealed_historical_micro_inputs_v01 -v
          python -O -m unittest tests.test_sealed_historical_management_capture_v01 tests.test_sealed_historical_management_reuse_v01 tests.test_sealed_historical_micro_inputs_v01 -v
          python - <<'PY'
          from pathlib import Path
          from check_recovery_entrypoints_v13 import undefined_globals
          for name in ('scripts/capture_sealed_historical_management_inputs_v01.py', 'src/momentumbot/research/sealed_historical_management_capture_v01.py'):
              missing = undefined_globals(Path(name).read_text(), name)
              if missing:
                  raise SystemExit(f'{name}: {sorted(missing)}')
          PY
