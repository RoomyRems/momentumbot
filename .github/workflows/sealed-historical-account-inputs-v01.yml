name: Sealed historical account and management inputs v0.1

on:
  push:
    branches: [phase-3-historical-snapshot]
    paths:
      - .github/workflows/sealed-historical-account-inputs-v01.yml
      - src/momentumbot/research/sealed_historical_account_inputs_v01.py
      - scripts/build_sealed_historical_account_inputs_v01.py
      - tests/test_sealed_historical_account_inputs_v01.py
      - research/strategy/sealed-historical-account-management-inputs-v0.1.json
      - research/runtime/sealed-historical-account-management-inputs-v0.1/**
      - requirements-sealed-execution-quote-v01.txt

permissions:
  contents: read

concurrency:
  group: sealed-historical-account-inputs-v01-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install hash-locked validation environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-execution-quote-v01.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Reconstruct committed input plan offline
        run: python scripts/build_sealed_historical_account_inputs_v01.py --verify
      - name: Verify seed, chronology and frozen management mechanics
        run: |
          python -m unittest tests.test_sealed_historical_account_inputs_v01 tests.test_account_priority_policy tests.test_campaign_portfolio tests.test_prospective_management_window -v
          python -O -m unittest tests.test_sealed_historical_account_inputs_v01 tests.test_account_priority_policy tests.test_campaign_portfolio tests.test_prospective_management_window -v
          python - <<'PY'
          from pathlib import Path
          from check_recovery_entrypoints_v13 import undefined_globals
          for name in ('scripts/build_sealed_historical_account_inputs_v01.py', 'src/momentumbot/research/sealed_historical_account_inputs_v01.py'):
              missing = undefined_globals(Path(name).read_text(), name)
              if missing:
                  raise SystemExit(f'{name}: {sorted(missing)}')
          PY
