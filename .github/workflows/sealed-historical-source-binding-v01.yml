name: Sealed historical source binding v0.1

on:
  push:
    branches: [phase-3-historical-snapshot]
    paths:
      - .github/workflows/sealed-historical-source-binding-v01.yml
      - src/momentumbot/research/sealed_historical_source_binding_v01.py
      - scripts/build_sealed_historical_source_binding_v01.py
      - scripts/verify_sealed_historical_source_binding_v01.py
      - tests/test_sealed_historical_source_binding_v01.py
      - research/strategy/sealed-historical-source-binding-v0.1.json
      - research/runtime/sealed-historical-source-binding-v0.1/**
      - requirements-sealed-execution-quote-v01.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: sealed-historical-source-binding-v01
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install hash-locked validation environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-execution-quote-v01.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Reconstruct source-binding registration offline
        run: python scripts/build_sealed_historical_source_binding_v01.py --verify
      - name: Verify source binding and frozen parent mechanics
        run: |
          python -m unittest tests.test_sealed_historical_source_binding_v01 tests.test_sealed_historical_account_continuity_v01 tests.test_sealed_historical_management_inputs_v01 tests.test_sealed_historical_management_exit_inputs_v01 -v
          python -O -m unittest tests.test_sealed_historical_source_binding_v01 tests.test_sealed_historical_account_continuity_v01 tests.test_sealed_historical_management_inputs_v01 tests.test_sealed_historical_management_exit_inputs_v01 -v
      - name: Download only five immutable GitHub evidence archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/RoomyRems/momentumbot/actions/artifacts/9993250947/zip > "$RUNNER_TEMP/scanner.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/10028253493/zip > "$RUNNER_TEMP/management.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/10037358910/zip > "$RUNNER_TEMP/exit.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/10004782232/zip > "$RUNNER_TEMP/entry-result.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/10004656665/zip > "$RUNNER_TEMP/entry-consumption.zip"
      - name: Bind every original source without executing accounts
        run: |
          BINDING_REGISTRATION_SHA=$(python -c 'import json; print(json.load(open("research/runtime/sealed-historical-source-binding-v0.1/freeze-manifest.json"))["content_sha256"])')
          python scripts/build_sealed_historical_source_binding_v01.py --bind-sources \
            --expected-registration-sha256 "$BINDING_REGISTRATION_SHA" \
            --scanner-zip "$RUNNER_TEMP/scanner.zip" --management-zip "$RUNNER_TEMP/management.zip" \
            --exit-zip "$RUNNER_TEMP/exit.zip" --entry-result-zip "$RUNNER_TEMP/entry-result.zip" \
            --entry-consumption-zip "$RUNNER_TEMP/entry-consumption.zip" --output-root "$RUNNER_TEMP/source-bindings"
      - name: Independently verify original bytes, candidate priority and all account contexts
        run: |
          BINDING_MANIFEST_SHA=$(python -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/source-bindings/source-bindings.json"))["content_sha256"])')
          python scripts/verify_sealed_historical_source_binding_v01.py \
            --expected-source-bindings-sha256 "$BINDING_MANIFEST_SHA" \
            --scanner-zip "$RUNNER_TEMP/scanner.zip" --management-zip "$RUNNER_TEMP/management.zip" \
            --exit-zip "$RUNNER_TEMP/exit.zip" --entry-result-zip "$RUNNER_TEMP/entry-result.zip" \
            --entry-consumption-zip "$RUNNER_TEMP/entry-consumption.zip" \
            --binding-root "$RUNNER_TEMP/source-bindings" --output "$RUNNER_TEMP/source-bindings/independent-verification.json"
      - name: Retain original source bindings and independent verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-historical-source-binding-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-bindings
          if-no-files-found: error
          retention-days: 90
