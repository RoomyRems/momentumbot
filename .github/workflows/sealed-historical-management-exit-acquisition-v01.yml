name: Sealed historical management exit acquisition v0.1

on:
  push:
    branches: [phase-3-historical-snapshot]
    paths:
      - .github/workflows/sealed-historical-management-exit-acquisition-v01.yml
      - requirements-sealed-execution-quote-v01.txt
      - research/runtime/sealed-historical-management-exit-acquisition-v0.1/**
      - research/strategy/sealed-historical-management-exit-acquisition-v0.1.json
      - research/strategy/sealed-historical-management-exit-acquisition-v0.1-execution.json
      - src/momentumbot/research/sealed_historical_management_exit_acquisition_v01.py
      - src/momentumbot/research/sealed_historical_management_exit_transport_v01.py
      - src/momentumbot/research/sealed_historical_record_order_v01.py
      - src/momentumbot/research/sealed_historical_record_order_registration_v01.py
      - scripts/acquire_sealed_historical_management_exit_inputs_v01.py
      - scripts/verify_sealed_historical_management_exit_acquisition_registration_v01.py
      - tests/test_sealed_historical_management_exit_acquisition_v01.py

permissions:
  contents: read

concurrency:
  group: sealed-historical-management-exit-acquisition-v01
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.detect.outputs.execute }}
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect only the sole added execution record
        id: detect
        run: |
          python - <<'PY'
          import os, subprocess
          path = 'research/strategy/sealed-historical-management-exit-acquisition-v0.1-execution.json'
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          added = subprocess.check_output(['git', 'diff', '--diff-filter=A', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          execute = path in changed
          if execute and (changed != [path] or added != [path]):
              raise SystemExit('Only the sole added execution record can start acquisition')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'execute={str(execute).lower()}\n')
          PY
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install hash-locked acquisition environment without credentials
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-execution-quote-v01.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify exact parents and exit acquisition tests normally and optimized
        run: |
          python scripts/acquire_sealed_historical_management_exit_inputs_v01.py --validate-only --check-environment
          python scripts/verify_sealed_historical_management_exit_acquisition_registration_v01.py
          python -O scripts/verify_sealed_historical_management_exit_acquisition_registration_v01.py
          python -m unittest tests.test_sealed_historical_management_exit_acquisition_v01 tests.test_sealed_historical_management_exit_quote_v01 tests.test_sealed_historical_execution_acquisition_v03 tests.test_sealed_historical_execution_acquisition_v02 tests.test_sealed_historical_record_order_v01 -v
          python -O -m unittest tests.test_sealed_historical_management_exit_acquisition_v01 tests.test_sealed_historical_management_exit_quote_v01 tests.test_sealed_historical_execution_acquisition_v03 tests.test_sealed_historical_execution_acquisition_v02 tests.test_sealed_historical_record_order_v01 -v
          python - <<'PY'
          from pathlib import Path
          from check_recovery_entrypoints_v13 import undefined_globals
          for name in ['scripts/acquire_sealed_historical_management_exit_inputs_v01.py', 'scripts/verify_sealed_historical_management_exit_acquisition_registration_v01.py', 'src/momentumbot/research/sealed_historical_management_exit_acquisition_v01.py', 'src/momentumbot/research/sealed_historical_management_exit_transport_v01.py']:
              missing = undefined_globals(Path(name).read_text(), name)
              if missing:
                  raise SystemExit(f'{name}: {sorted(missing)}')
          PY

  acquire:
    needs: validate
    if: needs.validate.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact first-attempt execution child
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/phase-3-historical-snapshot
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git diff --name-only HEAD^ HEAD)" = research/strategy/sealed-historical-management-exit-acquisition-v0.1-execution.json
          test "$(git diff --diff-filter=A --name-only HEAD^ HEAD)" = research/strategy/sealed-historical-management-exit-acquisition-v0.1-execution.json
          printf 'EXECUTION_CODE_COMMIT_SHA=%s\n' "$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          printf 'EXECUTION_CODE_TREE_SHA=%s\n' "$(git show -s --format=%T HEAD^)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install and retain the exact locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-execution-quote-v01.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
          mkdir management-exit-input-v01-preflight
          python -m pip freeze --all > management-exit-input-v01-preflight/pip-freeze.txt
      - name: Validate execution and every parent byte offline
        run: python scripts/acquire_sealed_historical_management_exit_inputs_v01.py --validate-only --check-execution
      - name: Verify successful CI and dedicated validation at the exact code parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          value = json.loads(Path('research/strategy/sealed-historical-management-exit-acquisition-v0.1-execution.json').read_text())
          for field, path in [('code_ci_run_id', '.github/workflows/ci.yml'), ('code_validation_run_id', '.github/workflows/sealed-historical-management-exit-acquisition-v01.yml')]:
              result = json.loads(subprocess.check_output(['gh', 'api', f'repos/RoomyRems/momentumbot/actions/runs/{value[field]}'], text=True))
              expected = {'head_sha': value['code_commit_sha'], 'head_branch': 'phase-3-historical-snapshot', 'event': 'push', 'run_attempt': 1, 'status': 'completed', 'conclusion': 'success', 'path': path}
              if any(result.get(k) != v for k, v in expected.items()):
                  raise SystemExit('Exact code validation run differs')
              Path(f'management-exit-input-v01-preflight/{field}.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          PY
      - name: Verify both immutable retained parent artifacts and protected refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          from momentumbot.research import sealed_historical_management_exit_acquisition_v01 as acq
          root = Path('management-exit-input-v01-preflight')
          def get(path):
              return json.loads(subprocess.check_output(['gh','api','repos/RoomyRems/momentumbot/'+path],text=True))
          commit = get('git/commits/'+acq.PARENT_COMMIT)
          if commit['sha'] != acq.PARENT_COMMIT or commit['tree']['sha'] != acq.PARENT_TREE:
              raise SystemExit('Exact verified parent checkpoint differs')
          (root/'parent-commit.json').write_text(json.dumps(commit,indent=2,sort_keys=True)+'\n')
          for name, spec in acq.PARENT_ARTIFACTS.items():
              run = get('actions/runs/'+str(spec['run_id']))
              expected = {'id':spec['run_id'],'head_sha':spec['execution_commit_sha'],
                  'head_branch':'phase-3-historical-snapshot','event':'push','run_attempt':1,
                  'status':'completed','conclusion':spec['conclusion'],'path':spec['workflow_path']}
              if any(run.get(k) != v for k,v in expected.items()):
                  raise SystemExit('Consumed parent run differs')
              artifact = get('actions/artifacts/'+str(spec['id']))
              if (artifact['id'] != spec['id'] or artifact['workflow_run']['id'] != spec['run_id']
                  or artifact['name'] != spec['name'] or artifact['digest'] != 'sha256:'+spec['sha256']
                  or artifact['expired'] is not False or artifact['size_in_bytes'] != spec['bytes']):
                  raise SystemExit('Exact parent artifact differs')
              (root/(name+'.run.json')).write_text(json.dumps(run,indent=2,sort_keys=True)+'\n')
              (root/(name+'.artifact.json')).write_text(json.dumps(artifact,indent=2,sort_keys=True)+'\n')
              with (root/name).open('xb') as out:
                  subprocess.run(['gh','api','repos/RoomyRems/momentumbot/actions/artifacts/'+str(spec['id'])+'/zip'],stdout=out,check=True)
          acq.verify_parents(root,Path('.'))
          refs = {}
          for ref, sha in acq.IMMUTABLE_REFS.items():
              observed = get('git/ref/'+ref)
              if observed.get('ref') != 'refs/'+ref or observed.get('object',{}).get('sha') != sha:
                  raise SystemExit('Protected evidence ref differs')
              refs[ref] = observed
          (root/'immutable-parent-refs.json').write_text(json.dumps(refs,indent=2,sort_keys=True)+'\n')
          PYCODE
      - name: Atomically consume the exact acquisition once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/RoomyRems/momentumbot/git/refs -f ref=refs/tags/sealed-historical-management-exit-acquisition-v0.1-consumed -f sha="$GITHUB_SHA" > management-exit-input-v01-preflight/consumption-ref.json
          python scripts/acquire_sealed_historical_management_exit_inputs_v01.py --consume --preflight-root management-exit-input-v01-preflight
      - name: Durably upload consumption before provider access
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-historical-management-exit-input-v01-consumption-${{ github.run_id }}-${{ github.run_attempt }}
          path: management-exit-input-v01-preflight
          if-no-files-found: error
          retention-days: 90
      - name: Requote then acquire only the 80 registered exact exit requests
        timeout-minutes: 35
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: python scripts/acquire_sealed_historical_management_exit_inputs_v01.py --acquire --preflight-root management-exit-input-v01-preflight --output-root management-exit-inputs-v01
      - name: Retain sanitized complete or partial input evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-historical-management-exit-input-v01-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: management-exit-inputs-v01
          if-no-files-found: ignore
          retention-days: 90
