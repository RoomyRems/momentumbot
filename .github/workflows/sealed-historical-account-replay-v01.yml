name: Sealed historical account replay v0.1

on:
  push:
    branches: [phase-3-historical-snapshot]
    paths:
      - .github/workflows/sealed-historical-account-replay-v01.yml
      - src/momentumbot/research/sealed_historical_account_replay_v01.py
      - scripts/build_sealed_historical_account_replay_v01.py
      - scripts/verify_sealed_historical_account_replay_v01.py
      - tests/test_sealed_historical_account_replay_v01.py
      - research/strategy/sealed-historical-account-replay-v0.1.json
      - research/runtime/sealed-historical-account-replay-v0.1/**
      - requirements-sealed-execution-quote-v01.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: sealed-historical-account-replay-v01
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.14"
      - name: Install hash-locked validation environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements-sealed-execution-quote-v01.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify frozen registration and component mechanics offline
        run: |
          python scripts/build_sealed_historical_account_replay_v01.py --verify
          python -m unittest tests.test_sealed_historical_account_replay_v01 tests.test_sealed_historical_source_binding_v01 tests.test_sealed_historical_account_continuity_v01 -v
          python -O -m unittest tests.test_sealed_historical_account_replay_v01 tests.test_sealed_historical_source_binding_v01 tests.test_sealed_historical_account_continuity_v01 -v
      - name: Download only immutable original evidence and verified binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/RoomyRems/momentumbot/actions/artifacts/9993250947/zip > "$RUNNER_TEMP/scanner.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/10028253493/zip > "$RUNNER_TEMP/management.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/10037358910/zip > "$RUNNER_TEMP/exit.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/10004782232/zip > "$RUNNER_TEMP/entry-result.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/10004656665/zip > "$RUNNER_TEMP/entry-consumption.zip"
          gh api repos/RoomyRems/momentumbot/actions/artifacts/10060984490/zip > "$RUNNER_TEMP/binding.zip"
      - name: Execute all original account paths offline with explicit blocked continuation
        run: |
          REPLAY_REGISTRATION_SHA=$(python -c 'import json; print(json.load(open("research/runtime/sealed-historical-account-replay-v0.1/freeze-manifest.json"))["content_sha256"])')
          python scripts/build_sealed_historical_account_replay_v01.py --replay \
            --expected-registration-sha256 "$REPLAY_REGISTRATION_SHA" \
            --scanner-zip "$RUNNER_TEMP/scanner.zip" --management-zip "$RUNNER_TEMP/management.zip" \
            --exit-zip "$RUNNER_TEMP/exit.zip" --entry-result-zip "$RUNNER_TEMP/entry-result.zip" \
            --entry-consumption-zip "$RUNNER_TEMP/entry-consumption.zip" --output-root "$RUNNER_TEMP/account-replay"
      - name: Independently verify original chronology, accounting and carry
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from momentumbot.research.sealed_historical_source_binding_v01 import extract_archive
          root = Path(os.environ["RUNNER_TEMP"])
          extract_archive(root / "binding.zip", {"bytes": 377229, "sha256": "2577dfdccdee948c9241d3489737e0dac40cf3c97ad826ead9500c095e55d94a"}, root / "source-bindings")
          PY
          REPLAY_RUNTIME_SHA=$(python -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/account-replay/account-replay.json"))["content_sha256"])')
          python scripts/verify_sealed_historical_account_replay_v01.py \
            --runtime-root "$RUNNER_TEMP/account-replay" --binding-root "$RUNNER_TEMP/source-bindings" \
            --expected-runtime-sha256 "$REPLAY_RUNTIME_SHA" --output "$RUNNER_TEMP/account-replay/independent-verification.json"
      - name: Retain runtime, independent check and any failed attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-historical-account-replay-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/account-replay
            ${{ runner.temp }}/account-replay-attempt.json
            ${{ runner.temp }}/account-replay-failure.json
          if-no-files-found: error
          retention-days: 90
